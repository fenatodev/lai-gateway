[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lai-gateway"
version = "0.1.33"
description = "Private companion gateway for lai harness control-plane clients."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FenatoDev" }]

[project.scripts]
lai-gateway = "lai_gateway.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["lai_gateway*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
lai_gateway = ["static/*"]
